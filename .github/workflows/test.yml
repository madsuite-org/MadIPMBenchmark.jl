name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - run: git clone -q https://github.com/madsuite-org/MadIPM.jl ../madipm
      - run: julia --startup-file=no setup.jl ../madipm
      - run: julia --startup-file=no --project=. run.jl smoke --config=default,highs --workers=1 --root=results
      - run: cat results/*/summary.md
      - run: bash -n runner/publish.sh
